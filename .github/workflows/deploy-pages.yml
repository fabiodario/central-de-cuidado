name: Publicar Central de Cuidado

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # O BANCO VEM PRIMEIRO, e tudo o mais depende dele.
  #
  # Antes as migrations rodavam DEPOIS de publicar as Edge Functions, no mesmo
  # trabalho, e o site subia em paralelo sem depender de nenhum dos dois. Isso
  # garantia uma janela em que o codigo novo conversava com o banco velho.
  #
  # Em 17/09/2026 a janela deixou de ser janela e virou buraco: uma migration
  # com erro de SQL (min(uuid), que o Postgres nao tem) falhou, e como o
  # db push para na primeira que falha, TRES DIAS de alteracoes de banco
  # ficaram paradas. O site e as funcoes continuaram subindo normalmente, sem
  # as colunas que pediam. O robo respondeu o menu tres vezes seguidas para uma
  # paciente de verdade, e nada no processo acusou.
  #
  # Agora e simples: migration falhou, nada vai ao ar. A publicacao fica
  # vermelha e a producao continua inteira, rodando a versao anterior.
  #
  # O PROJETO DO SUPABASE VEM DE VARIAVEL DO REPOSITORIO (15/10/2026).
  #
  # Este sistema e espelho do sistema do Dr. Marcello Ruiz, e aqui estava fixo o
  # projeto DELE (favohmryseurvnlxocfc). Publicado assim, o primeiro push do Dr.
  # Fabio rodaria as migrations no banco de producao de outra clinica. Agora o
  # projeto vem de Settings > Secrets and variables > Actions > Variables
  # (SUPABASE_PROJECT_REF, SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY), e a
  # conferencia abaixo para tudo se a variavel faltar ou apontar para o banco
  # do Dr. Marcello.
  banco:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    outputs:
      token: ${{ steps.token.outputs.presente }}
    steps:
      - name: Conferir de qual clinica e o banco
        run: |
          if [ -z "$PROJECT_REF" ]; then
            echo "::error::Falta a variavel SUPABASE_PROJECT_REF (o projeto Supabase do Dr. Fabio). Nada foi publicado."
            exit 1
          fi
          if [ "$PROJECT_REF" = "favohmryseurvnlxocfc" ]; then
            echo "::error::SUPABASE_PROJECT_REF aponta para o banco do Dr. Marcello. Nada foi publicado."
            exit 1
          fi

      - name: Baixar o projeto
        uses: actions/checkout@v6

      - name: Conferir se o token esta configurado
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "presente=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_ACCESS_TOKEN nao foi configurado nos secrets do repositorio. O banco e as Edge Functions nao serao publicados."
          else
            echo "presente=true" >> "$GITHUB_OUTPUT"
          fi

      # VERSAO FIXA, e nao "latest".
      #
      # Com "latest" a action pergunta ao GitHub qual e a ultima release da CLI,
      # e pergunta sem credencial nenhuma - entao entra na cota de visitante,
      # compartilhada com o mundo. Em 20/09/2026 a publicacao das 14:41 morreu
      # em 7 segundos com "rate limit exceeded", sem nada de errado no codigo: o
      # site montou, o artefato ficou pronto, e nao foi ao ar porque o banco
      # roda antes e falhou.
      #
      # A versao fixa nao faz pergunta nenhuma. Sobe quando alguem decidir
      # subir, e nao no dia em que a Supabase publicar uma versao nova - o que
      # tambem evita uma CLI diferente aparecer sozinha no meio de uma
      # publicacao.
      - name: Preparar a CLI do Supabase
        if: steps.token.outputs.presente == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Aplicar migrations do banco
        if: steps.token.outputs.presente == 'true'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::SUPABASE_DB_PASSWORD nao configurado. As migrations nao serao aplicadas automaticamente."
            exit 0
          fi
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"

  build:
    runs-on: ubuntu-latest
    env:
      # A chave publishable faz parte do frontend público. Nunca use service_role aqui.
      # Variaveis do repositorio do Dr. Fabio (ver o comentario do trabalho "banco").
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Conferir de qual clinica e o banco
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Faltam as variaveis SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY do Dr. Fabio. Nada foi publicado."
            exit 1
          fi
          if echo "$VITE_SUPABASE_URL" | grep -q "favohmryseurvnlxocfc"; then
            echo "::error::SUPABASE_URL aponta para o banco do Dr. Marcello. Nada foi publicado."
            exit 1
          fi

      - name: Baixar o projeto
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar o projeto
        run: npm run lint

      - name: Gerar a versao de producao
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos para publicacao
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # Tambem espera o banco: pagina nova com schema velho e o defeito que esta
    # regra existe para impedir.
    needs: [build, banco]
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # As Edge Functions nao faziam parte da publicacao. Por causa disso a funcao
  # rodando em producao ficou horas mais antiga que o codigo do repositorio, e o
  # sistema exibia um erro que ja estava corrigido aqui. Publicar as duas coisas
  # juntas impede que isso volte a acontecer.
  funcoes:
    runs-on: ubuntu-latest
    needs: banco
    if: needs.banco.outputs.token == 'true'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # O trabalho "banco" ja conferiu que nao e o projeto do Dr. Marcello.
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v6

      - name: Conferir se o token esta configurado
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "presente=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_ACCESS_TOKEN nao foi configurado nos secrets do repositorio. As Edge Functions nao serao publicadas."
          else
            echo "presente=true" >> "$GITHUB_OUTPUT"
          fi

      # Mesma versao fixa do trabalho do banco, pelo mesmo motivo.
      - name: Preparar a CLI do Supabase
        if: steps.token.outputs.presente == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Publicar as Edge Functions
        if: steps.token.outputs.presente == 'true'
        run: |
          supabase functions deploy whatsapp-send --project-ref "$PROJECT_REF"
          supabase functions deploy meta-webhook --project-ref "$PROJECT_REF"
          supabase functions deploy whatsapp-dispatch --project-ref "$PROJECT_REF"
          supabase functions deploy whatsapp-reply --project-ref "$PROJECT_REF"
          supabase functions deploy whatsapp-reopen --project-ref "$PROJECT_REF"
          supabase functions deploy appointment-reminders --project-ref "$PROJECT_REF"
          supabase functions deploy transcrever-audio --project-ref "$PROJECT_REF"
          supabase functions deploy assinar-consulta --project-ref "$PROJECT_REF"
          supabase functions deploy appointment-cancel --project-ref "$PROJECT_REF"
          supabase functions deploy whatsapp-perfil --project-ref "$PROJECT_REF"
          supabase functions deploy memed-prescritor --project-ref "$PROJECT_REF"
          supabase functions deploy memed-receita --project-ref "$PROJECT_REF"
          supabase functions deploy notificar-equipe --project-ref "$PROJECT_REF"
          supabase functions deploy ficha-pendente --project-ref "$PROJECT_REF"
